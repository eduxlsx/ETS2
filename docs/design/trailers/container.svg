<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1440 454" data-testid="trailer-side" data-type="container" role="img" aria-label="Reboque Porta-contêiner (contêiner 40') — vista lateral">
  <title>TRUCKPULSE — reboque: Porta-contêiner (contêiner 40')</title>
  <desc>Referência de design. Escala 100 px = 1 m; frente do reboque à DIREITA em x = 1400, traseira em x = 40 (13,6 m).
    x = 1400 − 100·m, y = 400 − 100·h. Piso h 1,45 (y 255); pino-rei a 1,25 m da frente (x 1275).
    Mapeamento SDK sugerido: body_type 'container' | id contém container, cont_ , 40ft, 20ft.
    Luzes com as mesmas classes do cavalo (tp-lamp / on): side-marker, tail, brake, blinker-left-rear, reverse.
    Estado de exemplo: lanternas e marcadores laterais ACESOS.</desc>
  <style>
    .t-shade{fill:#000;opacity:.14}.t-shade-2{fill:#000;opacity:.3}.t-hi{fill:#fff;opacity:.13}
