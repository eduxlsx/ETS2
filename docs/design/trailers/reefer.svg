<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1440 454" data-testid="trailer-side" data-type="reefer" role="img" aria-label="Reboque Frigorífico (reefer) — vista lateral">
  <title>TRUCKPULSE — reboque: Frigorífico (reefer)</title>
  <desc>Referência de design. Escala 100 px = 1 m; frente do reboque à DIREITA em x = 1400, traseira em x = 40 (13,6 m).
    x = 1400 − 100·m, y = 400 − 100·h. Piso h 1,45 (y 255); pino-rei a 1,25 m da frente (x 1275).
    Mapeamento SDK sugerido: body_type contém reef, refrig, cool, frozen, chill.
    Luzes com as mesmas classes do cavalo (tp-lamp / on): side-marker, tail, brake, blinker-left-rear, reverse.
    Estado de exemplo: lanternas e marcadores laterais ACESOS.</desc>
  <style>
    .t-shade{fill:#000;opacity:.14}.t-shade-2{fill:#000;opacity:.3}.t-hi{fill:#fff;opacity:.13}
    .t-seam{fill:none;stroke:#000;stroke-opacity:.35;stroke-width:1}.t-seam-hi{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:1}
    .t-plastic{fill:var(--truck-plastic,#2b2c2a)}.t-plastic-2{fill:var(--truck-plastic-2,#3a3b38)}.t-rubber{fill:var(--truck-rubber,#1b1b19)}
    .t-metal{fill:var(--truck-metal,#8e9196)}.t-metal-dk{fill:var(--truck-metal-dk,#5d6166)}.t-metal-lt{fill:var(--truck-metal-lt,#c4c6c9)}
    .t-glass{fill:var(--truck-glass,#1c2832)}.t-chassis{fill:var(--truck-chassis,#2a2b28)}.t-ink{fill:var(--truck-ink,#0b0b0a)}
    .t-out{stroke:var(--truck-outline,#4a4944);stroke-width:1;paint-order:stroke}
    .t-ground{stroke:var(--tp-line-strong,#45433d);stroke-width:1}
    .t-lens-amber{fill:var(--lens-amber,#4a3110)}.t-lens-red{fill:var(--lens-red,#3e1311)}.t-lens-clear{fill:var(--lens-clear,#30353a)}
    .t-lit-amber{fill:var(--lamp-amber,#ffa21a)}.t-lit-red{fill:var(--lamp-red,#ff2b1c)}.t-lit-white{fill:var(--lamp-white,#f4f1e6)}
    .tr-body{fill:var(--trailer-body,#d7dbe0)}.tr-reefer{fill:var(--trailer-reefer,#eceeef)}.tr-curtain{fill:var(--trailer-curtain,#3a5a7c)}
    .tr-alu{fill:var(--trailer-alu,#aeb3b8)}.tr-tape{fill:none;stroke:var(--trailer-tape,#e3b000);stroke-width:3;stroke-dasharray:28 18}
    .c-tank{fill:var(--cargo-tank,#b7bec8)}.c-container{fill:var(--cargo-container,#7d3a2c)}.c-wood{fill:var(--cargo-wood,#6f4c2c)}
    .c-wood-end{fill:var(--cargo-wood-end,#c9a46a)}.c-machine{fill:var(--cargo-machine,#d9a21b)}.c-crate{fill:var(--cargo-crate,#a07c4f)}
    .c-strap{fill:none;stroke:var(--cargo-strap,#c9a227);stroke-width:2.5}.c-adr{fill:#f07f12}.c-deck{fill:var(--cargo-deck,#5b4632)}
    .c-tx{fill:#fff;opacity:.8;font:600 14px 'B612 Mono',Consolas,monospace;letter-spacing:.06em}
    .tp-lamp{opacity:.12;transition:opacity 120ms linear}.tp-lamp.on{opacity:1}
    .tp-lamp.on.t-lit-amber{filter:drop-shadow(0 0 3px var(--lamp-amber,#ffa21a))}.tp-lamp.on.t-lit-red{filter:drop-shadow(0 0 3px var(--lamp-red,#ff2b1c))}
  </style>
