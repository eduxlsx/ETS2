<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 410" data-testid="truck-front" data-model="scania-r" role="img" aria-label="Cavalo-mecânico cab-over — vista frontal (referência de design)">
  <title>TRUCKPULSE — vista frontal mestre (família Scania R como base)</title>
  <desc>
    Referência de design. Caixa 300×410 (mesma do TruckFront.tsx). Escala 96 px = 1 m, solo em y = 400, eixo central x = 150.
    Cabine 2,50 m de largura (x 32–268), teto 3,77 m (y 38), base do para-brisa 2,15 m (y 194), para-choque 1,08–0,40 m.
    Bitola: centros dos pneus em x 52 e 248, pneu 315 mm = 30 px.
    LADO: olhando de frente, o lado ESQUERDO do caminhão aparece à DIREITA de quem olha.
    O farol do lado esquerdo do caminhão é o MESMO desenho espelhado com transform="translate(270 300) scale(-1 1)"
    (o teste vehicles.test.tsx verifica esse scale(-1 1)).
    Estado de exemplo: lanterna (parking), farol baixo, gabarito e feixe ACESOS; pisca esquerdo ACESO.
  </desc>
  <style>
    .t-paint{fill:var(--truck-paint,#c9ced6)}
    .t-shade{fill:#000;opacity:.16}
    .t-shade-2{fill:#000;opacity:.32}
    .t-hi{fill:#fff;opacity:.13}
    .t-seam{fill:none;stroke:#000;stroke-opacity:.38;stroke-width:1}
    .t-seam-hi{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:1}
    .t-plastic{fill:var(--truck-plastic,#2b2c2a)}
    .t-plastic-2{fill:var(--truck-plastic-2,#3a3b38)}
    .t-rubber{fill:var(--truck-rubber,#1b1b19)}
    .t-metal{fill:var(--truck-metal,#8e9196)}
    .t-metal-dk{fill:var(--truck-metal-dk,#5d6166)}
    .t-metal-lt{fill:var(--truck-metal-lt,#c4c6c9)}
    .t-glass{fill:var(--truck-glass,#1c2832)}
    .t-glass-hi{fill:#fff;opacity:.07}
    .t-chassis{fill:var(--truck-chassis,#2a2b28)}
    .t-ink{fill:var(--truck-ink,#0b0b0a)}
    .t-out{stroke:var(--truck-outline,#4a4944);stroke-width:1;paint-order:stroke}
    .t-plate{fill:var(--truck-plate,#e9e6dc)}
    .t-plate-eu{fill:var(--truck-plate-eu,#2a4fa0)}
    .t-ground{stroke:var(--tp-line-strong,#45433d);stroke-width:1}
    .t-lens-clear{fill:var(--lens-clear,#30353a)}
    .t-lens-amber{fill:var(--lens-amber,#4a3110)}
    .t-lit-white{fill:var(--lamp-white,#f4f1e6)}
    .t-lit-xenon{fill:var(--lamp-xenon,#e8f0ff)}
    .t-lit-amber{fill:var(--lamp-amber,#ffa21a)}
    .t-beam{fill:var(--lamp-xenon,#e8f0ff)}
    .t-logo{fill:var(--truck-metal-lt,#c4c6c9);font:600 10px 'Barlow Condensed','Bahnschrift',sans-serif;letter-spacing:.32em}
    .tp-lamp{opacity:.12;transition:opacity 120ms linear}
    .tp-lamp.on{opacity:1}
    .tp-lamp.on.t-lit-amber{filter:drop-shadow(0 0 3px var(--lamp-amber,#ffa21a))}
    .tp-beam{opacity:0;transition:opacity 200ms ease}
    .tp-beam.on{opacity:1}
  </style>
  <defs>
    <!-- Pneu dianteiro visto de frente: banda de rodagem com 3 sulcos longitudinais + lamelas -->
    <g id="f-tire">
      <rect x="0" y="0" width="30" height="40" rx="5" class="t-rubber t-out"/>
      <rect x="1" y="0" width="28" height="40" rx="4" fill="none" stroke="#fff" stroke-opacity=".06"/>
      <g stroke="#000" stroke-opacity=".75" stroke-width="1.8" fill="none">
        <path d="M 8 6 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4"/>
        <path d="M 15 6 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4"/>
        <path d="M 22 6 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4 l 1 4 l -1 4"/>
      </g>
      <g stroke="#000" stroke-opacity=".35" stroke-width="1">
        <path d="M 2 12 H 7 M 10 16 H 14 M 17 12 H 21 M 24 16 H 28 M 2 24 H 7 M 10 28 H 14 M 17 24 H 21 M 24 28 H 28 M 2 36 H 7 M 17 36 H 21"/>
      </g>
    </g>
    <!-- Espelho (principal + grande-angular) do lado esquerdo de quem olha -->
    <g id="f-mirror">
      <line x1="34" y1="108" x2="16" y2="100" stroke="var(--truck-plastic,#2b2c2a)" stroke-width="4"/>
      <line x1="32" y1="178" x2="16" y2="184" stroke="var(--truck-plastic,#2b2c2a)" stroke-width="4"/>
      <rect x="2" y="86" width="18" height="64" rx="3" class="t-plastic"/>
      <rect x="5" y="90" width="12" height="56" rx="1.5" class="t-glass"/>
      <path d="M 7 92 L 12 92 L 7 120 Z" class="t-glass-hi"/>
      <rect x="3" y="156" width="16" height="30" rx="3" class="t-plastic"/>
      <rect x="6" y="159" width="10" height="24" rx="1.5" class="t-glass"/>
    </g>
    <clipPath id="f-ws-clip"><path d="M 52 82 L 248 82 Q 254 82 254 88 L 258 186 Q 258 194 250 194 L 50 194 Q 42 194 42 186 L 46 88 Q 46 82 52 82 Z"/></clipPath>
  </defs>

  <!-- solo e feixe -->
  <line x1="0" y1="400" x2="300" y2="400" class="t-ground"/>
  <g class="tp-beam on" data-lamp="beam">
    <path class="t-beam" opacity=".07" d="M 20 400 L 280 400 L 268 405 L 32 405 Z"/>
    <path class="t-beam" opacity=".12" d="M 60 400 L 240 400 L 232 403 L 68 403 Z"/>
  </g>

  <!-- pneus + eixo -->
  <rect x="67" y="368" width="166" height="8" class="t-chassis"/>
  <ellipse cx="52" cy="400" rx="20" ry="2" class="t-ink" opacity=".5"/>
  <ellipse cx="248" cy="400" rx="20" ry="2" class="t-ink" opacity=".5"/>
  <use href="#f-tire" transform="translate(37 360)"/>
  <use href="#f-tire" transform="translate(233 360)"/>

  <!-- espelhos -->
  <use href="#f-mirror"/>
  <use href="#f-mirror" transform="translate(300 0) scale(-1 1)"/>

  <!-- defletores de canto (coluna A) -->
  <path d="M 32 200 L 40 72 L 34 74 L 26 200 Z" class="t-paint"/>
  <path d="M 32 200 L 40 72 L 34 74 L 26 200 Z" class="t-shade-2"/>
  <path d="M 268 200 L 260 72 L 266 74 L 274 200 Z" class="t-paint"/>
  <path d="M 268 200 L 260 72 L 266 74 L 274 200 Z" class="t-shade-2"/>

  <!-- cabine (casca) -->
  <g data-part="cab">
    <path d="M 32 296 L 32 200 L 40 60 Q 42 38 62 38 L 238 38 Q 258 38 260 60 L 268 200 L 268 296 Z" class="t-paint"/>
    <!-- plano do teto (mais claro) -->
    <path d="M 44 58 Q 46 42 62 42 L 238 42 Q 254 42 256 58 L 256 64 L 44 64 Z" class="t-hi"/>
    <!-- retorno das laterais (mais escuro) -->
    <path d="M 32 296 L 32 200 L 40 60 L 47 58 L 41 200 L 41 296 Z" class="t-shade"/>
    <path d="M 268 296 L 268 200 L 260 60 L 253 58 L 259 200 L 259 296 Z" class="t-shade"/>
    <!-- vinco da linha de cintura -->
    <line x1="34" y1="199" x2="266" y2="199" class="t-seam-hi"/>
    <line x1="34" y1="200.5" x2="266" y2="200.5" class="t-seam"/>
    <!-- recesso sob o para-brisa (cowl) -->
    <rect x="42" y="194" width="216" height="6" class="t-shade-2"/>
    <!-- costuras verticais do painel frontal -->
    <line x1="56" y1="204" x2="56" y2="294" class="t-seam"/>
    <line x1="244" y1="204" x2="244" y2="294" class="t-seam"/>
  </g>

  <!-- para-brisa com interior insinuado -->
  <path d="M 52 82 L 248 82 Q 254 82 254 88 L 258 186 Q 258 194 250 194 L 50 194 Q 42 194 42 186 L 46 88 Q 46 82 52 82 Z" class="t-glass"/>
  <g clip-path="url(#f-ws-clip)">
    <!-- encostos (motorista à direita de quem olha = lado esquerdo do caminhão) -->
    <rect x="186" y="140" width="36" height="40" rx="4" class="t-ink" opacity=".3"/>
    <rect x="78" y="140" width="36" height="40" rx="4" class="t-ink" opacity=".3"/>
    <rect x="42" y="176" width="216" height="18" class="t-ink" opacity=".35"/>
    <ellipse cx="204" cy="176" rx="22" ry="5" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="2.5"/>
    <path d="M 66 82 L 104 82 L 76 194 L 38 194 Z" class="t-glass-hi"/>
    <path d="M 114 82 L 126 82 L 98 194 L 86 194 Z" class="t-glass-hi"/>
  </g>
  <path d="M 52 82 L 248 82 Q 254 82 254 88 L 258 186 Q 258 194 250 194 L 50 194 Q 42 194 42 186 L 46 88 Q 46 82 52 82 Z" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="2"/>

  <!-- para-sol -->
  <path d="M 44 72 L 256 72 L 252 88 L 48 88 Z" class="t-plastic"/>
  <line x1="48" y1="87.5" x2="252" y2="87.5" class="t-seam-hi"/>
  <!-- espelho frontal (classe VI) do lado do passageiro -->
  <line x1="62" y1="64" x2="64" y2="90" stroke="var(--truck-plastic,#2b2c2a)" stroke-width="2"/>
  <rect x="54" y="90" width="22" height="14" rx="4" class="t-plastic"/>

  <!-- gabarito do teto (5) -->
  <g>
    <rect x="59" y="64" width="10" height="5" rx="1" class="t-lens-clear"/>
    <rect x="59" y="64" width="10" height="5" rx="1" class="t-lit-white tp-lamp on" data-lamp="clearance"/>
    <rect x="125" y="64" width="10" height="5" rx="1" class="t-lens-clear"/>
    <rect x="125" y="64" width="10" height="5" rx="1" class="t-lit-white tp-lamp on" data-lamp="clearance"/>
    <rect x="145" y="64" width="10" height="5" rx="1" class="t-lens-clear"/>
    <rect x="145" y="64" width="10" height="5" rx="1" class="t-lit-white tp-lamp on" data-lamp="clearance"/>
    <rect x="165" y="64" width="10" height="5" rx="1" class="t-lens-clear"/>
    <rect x="165" y="64" width="10" height="5" rx="1" class="t-lit-white tp-lamp on" data-lamp="clearance"/>
    <rect x="231" y="64" width="10" height="5" rx="1" class="t-lens-clear"/>
    <rect x="231" y="64" width="10" height="5" rx="1" class="t-lit-white tp-lamp on" data-lamp="clearance"/>
  </g>

  <!-- barra de teto com 4 auxiliares (SDK: auxRoof) -->
  <g data-part="roof-bar">
    <rect x="84" y="35" width="4" height="4" class="t-plastic"/><rect x="212" y="35" width="4" height="4" class="t-plastic"/>
    <rect x="72" y="25" width="156" height="11" rx="1" class="t-plastic"/>
    <g>
      <circle cx="92" cy="30.5" r="5" class="t-ink"/><circle cx="92" cy="30.5" r="4" class="t-lens-clear"/>
      <circle cx="92" cy="30.5" r="3.8" class="t-lit-white tp-lamp" data-lamp="auxRoof" data-level="0"/>
      <circle cx="128" cy="30.5" r="5" class="t-ink"/><circle cx="128" cy="30.5" r="4" class="t-lens-clear"/>
      <circle cx="128" cy="30.5" r="3.8" class="t-lit-white tp-lamp" data-lamp="auxRoof" data-level="0"/>
      <circle cx="172" cy="30.5" r="5" class="t-ink"/><circle cx="172" cy="30.5" r="4" class="t-lens-clear"/>
      <circle cx="172" cy="30.5" r="3.8" class="t-lit-white tp-lamp" data-lamp="auxRoof" data-level="0"/>
      <circle cx="208" cy="30.5" r="5" class="t-ink"/><circle cx="208" cy="30.5" r="4" class="t-lens-clear"/>
      <circle cx="208" cy="30.5" r="3.8" class="t-lit-white tp-lamp" data-lamp="auxRoof" data-level="0"/>
    </g>
  </g>

  <!-- giroflex (2) -->
  <rect x="52" y="32" width="14" height="6" class="t-plastic"/>
  <path d="M 53 32 Q 53 20 59 20 Q 65 20 65 32 Z" class="t-lens-amber"/>
  <path d="M 53 32 Q 53 20 59 20 Q 65 20 65 32 Z" class="t-lit-amber tp-lamp tp-beacon" data-lamp="beacon"/>
  <rect x="234" y="32" width="14" height="6" class="t-plastic"/>
  <path d="M 235 32 Q 235 20 241 20 Q 247 20 247 32 Z" class="t-lens-amber"/>
  <path d="M 235 32 Q 235 20 241 20 Q 247 20 247 32 Z" class="t-lit-amber tp-lamp tp-beacon" data-lamp="beacon"/>

  <!-- limpadores (estacionados; no app giram com framer-motion em torno do pivô) -->
  <g data-lamp="wipers" class="">
    <line x1="104" y1="197" x2="68" y2="190" stroke="var(--truck-ink,#0b0b0a)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="189" x2="104" y2="189" stroke="var(--truck-ink,#0b0b0a)" stroke-width="2"/>
    <circle cx="104" cy="197" r="2.5" class="t-metal-dk"/>
  </g>
  <g data-lamp="wipers" class="">
    <line x1="196" y1="197" x2="160" y2="190" stroke="var(--truck-ink,#0b0b0a)" stroke-width="3" stroke-linecap="round"/>
    <line x1="138" y1="189" x2="196" y2="189" stroke="var(--truck-ink,#0b0b0a)" stroke-width="2"/>
    <circle cx="196" cy="197" r="2.5" class="t-metal-dk"/>
  </g>

  <!-- grade (família Scania: retângulo alto, lamelas horizontais) -->
  <g data-part="grille">
    <rect x="64" y="206" width="172" height="88" class="t-plastic-2"/>
    <rect x="66" y="208" width="168" height="14" class="t-plastic"/>
    <text x="150" y="219" text-anchor="middle" class="t-logo">SCANIA</text>
    <rect x="68" y="225" width="164" height="66" class="t-ink"/>
    <g class="t-paint">
      <rect x="66" y="230" width="168" height="4"/><rect x="66" y="240" width="168" height="4"/>
      <rect x="66" y="250" width="168" height="4"/><rect x="66" y="260" width="168" height="4"/>
      <rect x="66" y="270" width="168" height="4"/><rect x="66" y="280" width="168" height="4"/>
    </g>
    <g class="t-shade-2">
      <rect x="66" y="233" width="168" height="1"/><rect x="66" y="243" width="168" height="1"/>
      <rect x="66" y="253" width="168" height="1"/><rect x="66" y="263" width="168" height="1"/>
      <rect x="66" y="273" width="168" height="1"/><rect x="66" y="283" width="168" height="1"/>
    </g>
    <rect x="64" y="206" width="172" height="88" class="t-seam"/>
  </g>

  <!-- para-choque -->
  <path d="M 24 296 L 276 296 L 276 352 Q 276 362 266 362 L 34 362 Q 24 362 24 352 Z" class="t-plastic-2"/>
  <line x1="26" y1="296.5" x2="274" y2="296.5" class="t-seam-hi"/>
  <rect x="132" y="300" width="36" height="4" class="t-ink" opacity=".6"/>
  <rect x="104" y="316" width="92" height="24" rx="1" class="t-ink"/>
  <g stroke="var(--truck-plastic-2,#3a3b38)" stroke-width="1.5">
    <line x1="106" y1="322" x2="194" y2="322"/><line x1="106" y1="328" x2="194" y2="328"/><line x1="106" y1="334" x2="194" y2="334"/>
  </g>
  <rect x="122" y="342" width="56" height="12" rx="1" class="t-plate"/>
  <rect x="122" y="342" width="6" height="12" class="t-plate-eu"/>
  <g class="t-ink" opacity=".75">
    <rect x="133" y="345" width="5" height="6"/><rect x="140" y="345" width="5" height="6"/><rect x="149" y="345" width="5" height="6"/>
    <rect x="156" y="345" width="5" height="6"/><rect x="163" y="345" width="5" height="6"/><rect x="170" y="345" width="5" height="6"/>
  </g>
  <rect x="30" y="361" width="240" height="6" class="t-plastic"/>
  <rect x="144" y="356" width="12" height="6" class="t-metal-dk"/>

  <!-- auxiliares dianteiros / neblina (SDK: auxFront) -->
  <circle cx="54" cy="340" r="10" class="t-ink"/><circle cx="54" cy="340" r="8" class="t-lens-clear"/>
  <circle cx="54" cy="340" r="7.5" class="t-lit-white tp-lamp" data-lamp="auxFront" data-level="0"/>
  <circle cx="246" cy="340" r="10" class="t-ink"/><circle cx="246" cy="340" r="8" class="t-lens-clear"/>
  <circle cx="246" cy="340" r="7.5" class="t-lit-white tp-lamp" data-lamp="auxFront" data-level="0"/>

  <!-- FARÓIS. Coordenadas locais: x = 0 é a borda EXTERNA, cresce para o centro. w = 66, h = 24 -->
  <g transform="translate(30 300)" data-side="right">
    <path d="M 0 4 Q 0 0 4 0 L 60 0 Q 66 0 66 6 L 62 24 L 4 24 Q 0 24 0 20 Z" class="t-lens-clear" stroke="var(--truck-metal-dk,#5d6166)"/>
    <rect x="2" y="4" width="9" height="16" rx="1" class="t-lens-amber"/>
    <rect x="2" y="4" width="9" height="16" rx="1" class="t-lit-amber tp-lamp" data-lamp="blinker-right"/>
    <circle cx="24" cy="13" r="8.5" class="t-metal-dk"/>
    <circle cx="24" cy="13" r="7" class="t-lit-xenon tp-lamp on" data-lamp="lowBeam"/>
    <circle cx="44" cy="13" r="8.5" class="t-metal-dk"/>
    <circle cx="44" cy="13" r="7" class="t-lit-xenon tp-lamp" data-lamp="highBeam"/>
    <rect x="14" y="1.5" width="46" height="2.6" rx="1.3" class="t-lit-white tp-lamp on" data-lamp="parking"/>
  </g>
  <g transform="translate(270 300) scale(-1 1)" data-side="left">
    <path d="M 0 4 Q 0 0 4 0 L 60 0 Q 66 0 66 6 L 62 24 L 4 24 Q 0 24 0 20 Z" class="t-lens-clear" stroke="var(--truck-metal-dk,#5d6166)"/>
    <rect x="2" y="4" width="9" height="16" rx="1" class="t-lens-amber"/>
    <rect x="2" y="4" width="9" height="16" rx="1" class="t-lit-amber tp-lamp on" data-lamp="blinker-left"/>
    <circle cx="24" cy="13" r="8.5" class="t-metal-dk"/>
    <circle cx="24" cy="13" r="7" class="t-lit-xenon tp-lamp on" data-lamp="lowBeam"/>
    <circle cx="44" cy="13" r="8.5" class="t-metal-dk"/>
    <circle cx="44" cy="13" r="7" class="t-lit-xenon tp-lamp" data-lamp="highBeam"/>
    <rect x="14" y="1.5" width="46" height="2.6" rx="1.3" class="t-lit-white tp-lamp on" data-lamp="parking"/>
  </g>
</svg>
